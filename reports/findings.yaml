# MP277 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G011"          # your group id, e.g. "G042"
problem_id: "MP277"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "aisle_distance_m" # the column recorded in a different unit
    group_value: "Night"   # the value of shift whose rows are affected
    factor: 100            # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 34              # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "shelf_height_m"
    start_date: "2026-04-03" # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-25"   # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "zone_type"
    true_levels: 3         # how many real categories there are after cleaning

